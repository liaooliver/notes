name: Enterprise CI/CD Pipeline

on:
  # staging 的 PR 已經跑過 build + white-box，merge 後不再重跑；
  # main 的 push 仍需要重跑，因為 encryption 要用同一個 run 的 build 產物。
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "staging" ]

# 預設最小權限；只有 release job 需要寫入權限，於該 job 另外覆寫。
permissions:
  contents: read

jobs:
  # 1. Build 階段
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist/
          retention-days: 1

  # 2. White-box 階段 (等效 Checkmarx / Mend / Trivy)
  white-box:
    name: White-box Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2-1. SAST 靜態程式碼掃描 (等效 Checkmarx)
      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep --config=p/ci /src

      # 2-2. 依賴套件與檔案系統漏洞掃描 (等效 Mend + Trivy)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # 抓到高風險 CVE 立即熔斷 Pipeline

  # 3. Encryption 階段 (等效產物加密保護)
  encryption:
    name: Encrypt Artifacts
    needs: white-box
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-files
          path: dist

      - name: Package and Encrypt Artifact
        run: |
          tar -czf dist.tar.gz dist/
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in dist.tar.gz \
            -out dist.tar.gz.enc \
            -k "${{ secrets.DEPLOY_ENCRYPTION_KEY }}"

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-dist
          path: dist.tar.gz.enc
          retention-days: 7

  # 4. Ops-handoff 階段 (等效運維審批與交付門禁)
  ops-handoff:
    name: Ops Handoff / Production Release
    needs: encryption
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production # 綁定 Production 環境，觸發手動審核等待
    steps:
      - name: Download Encrypted Artifact
        uses: actions/download-artifact@v8
        with:
          name: encrypted-dist

      - name: Execute Deployment
        run: |
          echo "審核通過，取得加密檔 dist.tar.gz.enc，開始執行發布邏輯..."

  # 5. Release 階段 (build/掃描/加密/ops-handoff 全部通過後，才算版本號並發布)
  release:
    name: Semantic Release
    needs: ops-handoff
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
